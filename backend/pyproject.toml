[project]
name = "agentteam"
version = "0.1.0"
description = "Multi-agent coding team: MCP, loop engineering, LLMOps"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.40",
    "flask>=3.0",
    "mcp>=1.2,<2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentteam"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
